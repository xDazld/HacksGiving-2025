# Render Configuration
# Visit https://dashboard.render.com to deploy

services:
  - type: web
    name: milwaukee-domes-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEBUG
        value: false
      # Add your Appwrite credentials as environment variables in Render dashboard
